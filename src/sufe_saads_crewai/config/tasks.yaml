select_next_actions_task:
  description: >
    Review the current intelligence run and choose 1 to 5 next actions only from
    the approved ActionCatalog. Runtime inputs: run_goal={run_goal},
    search_query={search_query}, blackboard_json={blackboard_json}.
    Consider the goal, known gaps, query history, source quality, novelty,
    duplicate risk, remaining budget, source proposals, pending persistence
    work, and per-source failure diagnosis. Do not invent actions outside the
    catalog. Prefer source-specific query planning over one generic query for
    every source.
  expected_output: >
    A structured object with fields actions, planner_rationale, and
    should_start_collection. Each action must include action_type, priority,
    rationale, expected_gain, required_context, success_criteria,
    retry_conditions, stop_conditions, and estimated_cost_level.
  agent: autonomous_planner

search_registered_sources_task:
  description: >
    使用已批准来源执行真实情报采集。默认搜索 query 为 {search_query}，并结合
    前序规划任务中的 actions 和 blackboard_json={blackboard_json}。

    必须优先使用 registered_api_source_search 工具采集真实结构化来源：
    nvd_cve_api、arxiv_api、cisa_kev_json、osv_dev_api。

    不要把同一个宽泛 query 机械地丢给所有来源。必须按来源设计查询：
    NVD CVE API 面向 CVE，应拆分为攻击术语、AI 产品/组件、CWE、CVSS、hasKev、
    noRejected、keywordExactMatch、时间窗口等参数化查询；arXiv API 面向论文，
    适合 prompt injection、jailbreak、RAG poisoning、agent security 等主题检索；
    CISA KEV JSON 面向已在野利用漏洞，适合 CVE、产品、供应链与关键组件关键词；
    OSV.dev API 面向开源生态漏洞，适合 PyPI/npm/RustSec/GHSA 包名、PURL 或
    advisory id 查询。

    只允许从已批准来源正式采集；如果发现新来源，只能在后续提案任务中记录，
    不能在本任务采集。不得输出 mock.local 或任何 mock source 的结果。
  expected_output: >
    一个结构化对象，包含 query_text、source_names、items 和 batch_notes。
    每个 item 必须包含 source_name、source_uri、title、summary、relevance_score、
    topics 和 evidence_snippet。batch_notes 应说明每个来源采用的查询策略、
    低产出或失败来源，以及是否需要后续重试或降权。
  agent: source_intelligence_collector

assess_collection_yield_task:
  description: >
    评估最近一轮采集质量。根据前序采集结果判断每个来源的结果数量、新颖度、
    重复率、噪声率和证据质量。必须给出 per-source 诊断：例如 NVD 是否因为
    keywordSearch 过宽或过窄而低产出，OSV 是否因为缺少包名或生态参数而低产出，
    arXiv 是否因为论文主题偏离而高噪声，CISA KEV 是否只覆盖传统漏洞而无法覆盖
    AI 原生攻击。
  expected_output: >
    一个结构化对象，包含 metrics、low_yield_sources、high_noise_queries、
    useful_queries、novelty_summary 和 recommended_adjustments。recommended_adjustments
    必须包含针对具体来源的下一步建议，例如 NVD 拆分关键词、增加产品词、增加
    CWE/KEV 过滤，OSV 改用包名查询，arXiv 改为主题短语查询。
  agent: reflection_coverage_critic

analyze_coverage_gaps_task:
  description: >
    分析当前采集结果对大模型安全主题的覆盖情况。重点关注 prompt injection、
    jailbreak、agent tool abuse、data leakage、model supply chain、RAG poisoning。
    不仅要判断主题是否出现，还要区分情报类型：AI 原生攻击、AI 应用基础设施漏洞、
    AI 数据/模型供应链漏洞、论文研究、已在野利用漏洞。
  expected_output: >
    一个结构化对象，包含 gaps、overall_coverage_score 和 analysis_rationale。
    每个 gap 必须包含 topic、current_coverage、target_coverage、estimated_roi、
    recommended_query 和 priority。recommended_query 应尽量适合下一轮 source-specific
    查询，而不是一个过宽的通用搜索句子。
  agent: reflection_coverage_critic

expand_search_semantics_task:
  description: >
    根据覆盖缺口、query history、低产出来源和 per-source failure diagnosis，
    为每个高价值缺口生成搜索语义扩展。这个任务只负责语义和查询策略扩展，
    不直接采集数据，也不做最终停止判断。

    不要只给通用同义词。必须按来源输出不同检索词和查询模板：
    NVD 应输出 CVE description 中可能出现的漏洞类型词、AI 产品/组件词、
    CWE/KEV/CVSS 参数提示，以及应避免的过宽短词；
    OSV 应输出 ecosystem、package、PURL、advisory id 相关词；
    arXiv 应输出论文常用术语、攻击技术名称、评测/防御关键词；
    CISA KEV 应输出产品、厂商、已利用漏洞和传统漏洞类型关键词。

    对每个 gap 说明为什么这些词能弥补当前缺口，并指出哪些词会造成噪声。
  expected_output: >
    A structured object with fields expansions, overall_rationale, and confidence.
    Each expansion must include gap_topic, expanded_terms, source_specific_terms,
    global_negative_terms, rationale, and confidence. Each source_specific_terms
    item must include source_name, positive_terms, negative_terms, query_templates,
    parameter_hints, and rationale.
  agent: autonomous_planner

propose_new_sources_task:
  description: >
    根据前序采集结果和覆盖缺口提出潜在新情报来源。当前阶段不得从这些来源正式采集，
    只能生成 approval_status 为 pending 的来源提案。提案必须说明覆盖主题、可信理由、
    预期覆盖收益和风险说明。
  expected_output: >
    一个结构化对象，包含 proposals 和 rationale。每个 proposal 必须包含 source_name、
    base_uri、source_type、coverage_topics、expected_coverage_gain、trust_rationale、
    risk_notes 和 approval_status。approval_status 必须是 pending。
  agent: source_intelligence_collector

rewrite_search_strategy_task:
  description: >
    Based on the collection yield and coverage gaps, decide whether to rewrite
    the search query. Generate at most one next query for under-covered LLM
    security topics, but the rationale must also describe source-specific
    follow-up strategy. Avoid repeating query patterns that were high-noise,
    duplicate-heavy, or low-yield. For NVD, do not recommend a broad OR-style
    AI query; recommend split keyword/product/CWE/KEV searches. If meaningful
    coverage gaps remain, produce a concrete next query for another collection
    round instead of ending with a summary.
  expected_output: >
    A structured object with fields should_rewrite, rewritten_query,
    target_topics, topics_to_stop, rationale, and confidence. If no rewrite is
    needed, should_rewrite must be false and rewritten_query must be null.
  agent: autonomous_planner

evaluate_search_completeness_task:
  description: >
    判断当前搜索是否应该继续。综合前序采集、收益评估、覆盖缺口和 query 改写建议，
    给出继续或停止的明确结论。如果应该继续，提供 recommended_next_query；如果
    应该停止，提供 stop_reason。不要仅因为某个来源低产出就停止；应先判断是否还能
    通过 source-specific 策略提升覆盖，例如 NVD 产品/CWE/KEV 查询或 OSV 包名查询。
  expected_output: >
    一个结构化对象，包含 should_continue、completeness_score、missing_topics、
    recommended_next_query、stop_reason 和 rationale。recommended_next_query 和
    stop_reason 可以为 null，但必须保留字段。
  agent: reflection_coverage_critic
