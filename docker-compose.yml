services:
  # Unified Gradio console: intel_agent + ctinexus_kg + live verbose trace.
  #   docker compose up -d mongo web
  # If pypi.org SSL/timeouts fail during build:
  #   $env:PIP_INDEX_URL="https://pypi.tuna.tsinghua.edu.cn/simple"
  #   $env:PIP_TRUSTED_HOST="pypi.tuna.tsinghua.edu.cn"
  #   docker compose up -d --build web
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    env_file:
      - .env
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 8000
      INTEL_MONGO_URI: mongodb://mongo:27017
      INTEL_MONGO_DB: ${INTEL_MONGO_DB:-intel_agent}
      PYTHONPATH: /app/backend
      # Required so Claude Code allows bypassPermissions when the image runs as root.
      IS_SANDBOX: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ctinexus_output:/app/ctinexus_output
      # Live code: rebuild only when Python deps change; avoids re-pip on every edit.
      - ./backend:/app/backend
    depends_on:
      mongo:
        condition: service_healthy

  # Batch-only intel_agent (no UI). Optional rollback / CI path.
  #   docker compose run --rm intel-agent full --verbose
  intel-agent:
    build:
      context: .
      dockerfile: Dockerfile.intel_agent
    profiles: ["intel"]
    env_file:
      - .env
    environment:
      INTEL_MONGO_URI: mongodb://mongo:27017
      INTEL_MONGO_DB: ${INTEL_MONGO_DB:-intel_agent}
      IS_SANDBOX: "1"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: ["full", "--verbose"]

  # Host port 27018 avoids clashing with a local mongod on 27017.
  # Inside the compose network, services still use mongodb://mongo:27017.
  # Named volume only — never bind-mount ./data/mongo (cloud sync sidecars
  # like *.baiduyun* break WiredTiger). Legacy files in ./data/mongo are
  # archival; migrate with mongodump/mongorestore if needed.
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${INTEL_MONGO_DB:-intel_agent}
    ports:
      - "${INTEL_MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mongo_data:
