services:
  # Unified Gradio console: intel_agent + ctinexus_kg + live verbose trace.
  #   docker compose up -d mongo web
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 8000
      INTEL_MONGO_URI: mongodb://mongo:27017
      INTEL_MONGO_DB: ${INTEL_MONGO_DB:-intel_agent}
      PYTHONPATH: /app/backend
      # Required so Claude Code allows bypassPermissions when the image runs as root.
      IS_SANDBOX: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ctinexus_output:/app/ctinexus_output
    depends_on:
      mongo:
        condition: service_healthy

  # Batch-only intel_agent (no UI). Optional rollback / CI path.
  #   docker compose run --rm intel-agent full --verbose
  intel-agent:
    build:
      context: .
      dockerfile: Dockerfile.intel_agent
    profiles: ["intel"]
    env_file:
      - .env
    environment:
      INTEL_MONGO_URI: mongodb://mongo:27017
      INTEL_MONGO_DB: ${INTEL_MONGO_DB:-intel_agent}
      IS_SANDBOX: "1"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: ["full", "--verbose"]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${INTEL_MONGO_DB:-intel_agent}
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10
