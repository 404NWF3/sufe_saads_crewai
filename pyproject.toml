[project]
name = "sufe_saads_crewai"
version = "0.2.0"
description = "LLM-security intel_agent + ctinexus_kg + Gradio console"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.113",
    "pydantic>=2.7",
    "pymongo>=4.6",
    "ctinexus==0.2.1",
    "gradio>=5.0.0,<6.0.0",
    "matplotlib>=3.10.9",
]

[project.scripts]
intel-agent = "intel_agent.cli:main"
intel_full = "intel_agent.cli:run_full"
intel_incremental = "intel_agent.cli:run_incremental"
intel_latest = "intel_agent.cli:show_latest"
web = "console.app:main"

[dependency-groups]
agentsdk = [
    "claude-agent-sdk>=0.2.113",
]
intelagent = [
    "claude-agent-sdk>=0.2.113",
    "pydantic>=2.7",
    "pymongo>=4.6",
]
ctinexuskg = [
    "ctinexus==0.2.1",
    "pydantic>=2.7",
]
web = [
    "gradio>=5.0.0,<6.0.0",
    "claude-agent-sdk>=0.2.113",
    "pydantic>=2.7",
    "pymongo>=4.6",
    "ctinexus==0.2.1",
]
basekg = [
    "neo4j>=5.20",
    "openai>=1.40",
    "pypdf>=4.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=9.0.3",
    "mongomock>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/common", "backend/intel_agent", "backend/ctinexus_kg", "backend/console"]
